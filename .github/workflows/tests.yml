name: Tests

on:
  push:
    branches:
      - main
  pull_request:

# テストはリポジトリの中身を読むだけでよい。
permissions:
  contents: read

jobs:
  # ジョブ名（＝チェック名）は "test" のままにしておくこと。リポジトリの
  # ルールセットが必須チェックとして "test" を指名しているため、ここを変えると
  # そのチェックが現れなくなり、PR がマージできなくなる。
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Setup Java
        # Firestore エミュレータの実行に JRE が必要。
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '25'
          distribution: oracle
      - name: Install dependencies
        # firebase CLI も devDependency として lockfile で固定してあるため、
        # グローバル導入は要らない（同じ commit なら同じ CLI でテストされる）。
        run: npm ci
      - name: Run rules tests
        # emulators:exec がエミュレータの起動・終了を面倒みる。テストは
        # demo- 接頭辞のプロジェクトで動くため、認証も実プロジェクトも要らない。
        run: npm test
