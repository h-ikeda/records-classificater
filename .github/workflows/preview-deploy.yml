name: Preview deploy

# preview-build.yml が作った成果物を、実際に Firebase へ出す工程。
#
# **workflow_run は main のコンテキストで動く。** 走るワークフローの定義も、
# チェックアウトされるコードも既定ブランチのものになるため、PR 側から書き換え
# られない。デプロイ用の資格情報を使うのはここだけで、PR のコードはこの中で
# 一度も実行しない（成果物を配るだけ）。
#
# PR 側から来るのは次の 2 つだけで、どちらも信頼しない入力として扱う。
#
#   dist/ … 配信するファイル。プレビューとはそもそもこれを見るもの
#
# セキュリティルールは成果物からは受け取らず、開いている PR ぶんを GitHub API
# から集め直す（scripts/collect-preview-rules.js）。チャンネルごとに別々の
# ブロックとして並べるため、PR が同時に開いていても互いのルールは混ざらない。
# 各 PR の区間が自分のチャンネルの外へ出られないことは
# scripts/compose-firestore-rules.js が検証する。
#
# PR 番号は成果物の meta.json ではなく API から引き直す。成果物は PR 側で作られる
# ため、そこに書かれた番号をそのまま信じると、別の PR のチャンネルへ出させる
# ことができてしまう。
#
# 注意: workflow_run の実行は PR のチェック一覧には出ない。結果は成否にかかわらず
# PR コメントに出す（ここで書かなければ、PR 側には何も残らないため）。また、この
# ワークフローは **既定ブランチに存在して初めて動く** ため、これを追加する PR 自身の
# プレビューはマージされるまで更新されない。

on:
  workflow_run:
    workflows: ["Preview build"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  deploy:
    name: Deploy preview environment
    # ビルドが失敗・キャンセルされたときは何もしない。
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: preview-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: true
    env:
      PROJECT_ID: records-classificater
    steps:
      - name: Resolve the pull request
        id: pr
        # 番号は成果物ではなく、ビルドを起こしたコミットから引き直す。
        # 開いている PR であること、フォークではないことも合わせて確かめる。
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const sha = context.payload.workflow_run.head_sha;
            const { data: associated } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: sha,
            });
            const pr = associated.find((p) => p.state === 'open' && p.head.sha === sha);
            if (!pr) {
              core.setFailed(`コミット ${sha} に対応する開いている PR が見つかりません`);
              return;
            }
            const repo = `${context.repo.owner}/${context.repo.repo}`;
            if (pr.head.repo.full_name !== repo) {
              core.setFailed(`フォーク（${pr.head.repo.full_name}）からの PR にはプレビューを出しません`);
              return;
            }
            core.setOutput('number', String(pr.number));
            core.setOutput('sha', sha);
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 既定ブランチを明示する。workflow_run のチェックアウト先を暗黙に
          # 任せると、意図と違うものを取ってくる余地が残るため。
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        # main の lockfile で入れる。PR 側の package.json は使わない
        # （インストールスクリプトを踏まないため）。
        run: npm ci
      - name: Download the preview artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: preview
          path: incoming
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Check the artifact
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.sha }}
        run: |
          for f in incoming/meta.json incoming/dist/index.html; do
            [ -f "$f" ] || { echo "::error::成果物に $f がありません"; exit 1; }
          done
          meta_pr="$(jq -r '.pr' incoming/meta.json)"
          meta_sha="$(jq -r '.sha' incoming/meta.json)"
          if [ "$meta_pr" != "$PR_NUMBER" ] || [ "$meta_sha" != "$HEAD_SHA" ]; then
            echo "::error::成果物の中身（PR $meta_pr / $meta_sha）が、API から引いた PR $PR_NUMBER / $HEAD_SHA と一致しません"
            exit 1
          fi
          echo "PR=$PR_NUMBER" >> "$GITHUB_ENV"
          echo "PR $PR_NUMBER（$HEAD_SHA）の成果物を受け取りました"
      - name: Collect the preview rules of every open pull request
        # 「今デプロイする PR」だけでなく、開いている PR ぶんを集める。
        # ルールセットはプロジェクトに 1 つなので、ここで全部を組み直さないと
        # ほかの PR のプレビューのルールが消えてしまう。
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/collect-preview-rules.js --repo '${{ github.repository }}' --out previews
      - name: Compose the security rules
        # 本番の区間は main のもの、プレビューの区間はチャンネルごとに各 PR の
        # ものを使う。各 PR のルールは preview-channels/pr-<番号>/ 配下へ
        # 入れ子にされ、そこから出られないことを合成スクリプトが検証する。
        #
        # --required-channel で、いまデプロイする PR のルールだけは検証に落ちたら
        # ジョブを止める。ほかの PR のルールが壊れていた場合は、その PR を飛ばして
        # 続ける（1 つの PR のせいで、ほかの PR のプレビューまで出せなくなるのを
        # 避けるため。飛ばしたことは警告として残る）。
        run: |
          node scripts/compose-firestore-rules.js \
            --production firestore.rules \
            --previews previews \
            --required-channel "pr-$PR" \
            --production-label "main" \
            --out firestore.composed.rules
          echo "--- 実際にデプロイするルール ---"
          cat firestore.composed.rules
      - name: Stage the built site
        run: |
          rm -rf dist
          mv incoming/dist dist
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_RECORDS_CLASSIFICATER }}'
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Deploy the composed security rules
        # ルールを先に出す。チャンネルより後にすると、プレビューが開いた直後の
        # 読み書きがルール不在で弾かれる時間帯ができる。
        run: |
          npx --no-install firebase deploy \
            --only firestore:rules \
            --project "$PROJECT_ID" \
            --non-interactive
      - name: Deploy to preview channel
        id: deploy
        run: |
          npx --no-install firebase hosting:channel:deploy "pr-$PR" \
            --project "$PROJECT_ID" \
            --expires 7d \
            --non-interactive \
            --json > channel.json
          echo "url=$(jq -r '.result | to_entries[0].value.url' channel.json)" >> "$GITHUB_OUTPUT"
      - name: Authorize the preview URL for Firebase Auth
        # 通常は hosting:channel:deploy がチャンネル URL を自動で登録するため、
        # ここは「登録されていること」の確認に落ち着き、書き込みは欠けていた
        # ときだけ起きる。
        #
        # URL のハッシュはチャンネルが生きている間は変わらない。ただしチャンネル
        # が失効した後に再デプロイすると別のハッシュになり、古いホスト名が残る。
        # preview-cleanup.yml が「--pr-<番号>-」を含むホストを *すべて* 消すのは
        # このため。
        #
        # この API は配列を渡すと **全置換** する。取得に失敗したり空が返って
        # きたりしたときにそのまま PATCH すると、本番のドメインごと消える。
        # 取得できたことを確かめてから追加し、書いたあとに「消えたものが無い」
        # ことまで確認する。
        env:
          URL: '${{ steps.deploy.outputs.url }}'
        run: |
          host="${URL#https://}"
          host="${host%%/*}"
          case "$host" in
            ''|*[!a-zA-Z0-9.-]*)
              echo "::error::プレビュー URL からホスト名を取り出せませんでした: $URL"
              exit 1
              ;;
          esac
          api="https://identitytoolkit.googleapis.com/admin/v2/projects/$PROJECT_ID/config"
          token="$(gcloud auth print-access-token)"
          before="$(curl -sS --fail-with-body -H "Authorization: Bearer $token" "$api")"
          if [ "$(jq '.authorizedDomains | length' <<<"$before")" -eq 0 ]; then
            echo "::error::承認済みドメインの一覧を取得できませんでした（本番のドメインを消さないよう中断します）"
            exit 1
          fi
          if jq -e --arg h "$host" '.authorizedDomains | index($h)' <<<"$before" >/dev/null; then
            echo "$host は既に承認済みドメインに入っています"
            exit 0
          fi
          curl -sS --fail-with-body -X PATCH \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            "$api?updateMask=authorizedDomains" \
            -d "$(jq --arg h "$host" '{authorizedDomains: (.authorizedDomains + [$h])}' <<<"$before")" \
            > /dev/null
          after="$(curl -sS --fail-with-body -H "Authorization: Bearer $token" "$api")"
          if ! jq -e --arg h "$host" '.authorizedDomains | index($h)' <<<"$after" >/dev/null; then
            echo "::error::$host を承認済みドメインに追加できませんでした"
            exit 1
          fi
          lost="$(jq -r --argjson b "$(jq '.authorizedDomains' <<<"$before")" '$b - .authorizedDomains | join(", ")' <<<"$after")"
          if [ -n "$lost" ]; then
            echo "::error::承認済みドメインから消えたものがあります（要復旧）: $lost"
            exit 1
          fi
          echo "承認済みドメインに $host を追加しました"
      - name: Check that the preview URL is reachable
        id: reachable
        # デプロイの成否だけでなく、URL が実際に開けることを毎回確かめる。
        # ここを省くと、URL を貼られた人が最初の失敗を踏むことになる。
        #
        # ただし **ここではジョブを止めない**。workflow_run の実行は PR のチェック
        # 一覧に出ないため、コメントより手前で終わると PR 側には成功も失敗も何も
        # 残らず、「プレビューが出ない理由がどこにも無い」状態になる。結果は出力に
        # 置き、コメントへ書いたうえで最後のステップで落とす。
        #
        # 待ち時間は伸ばしながら合わせて 3 分ほど見る。作りたてのチャンネルは
        # 配信に載るまで待たされることがあり、実際に 50 秒では足りずに 404 の
        # まま終わった（#465）。
        env:
          URL: '${{ steps.deploy.outputs.url }}'
        run: |
          code=000
          for wait in 0 5 10 15 20 30 30 30 30 30; do
            [ "$wait" -eq 0 ] || sleep "$wait"
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$URL" || echo 000)"
            if [ "$code" = "200" ]; then
              echo "疎通確認 OK: $URL"
              echo "ok=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "HTTP $code（チャンネルの反映待ちの可能性あり）"
          done
          echo "::warning::プレビュー URL がまだ開けません（最後の応答: HTTP $code）。$URL"
          {
            echo "ok=false"
            echo "code=$code"
          } >> "$GITHUB_OUTPUT"
      - name: Comment the result on PR
        # workflow_run の実行は PR のチェック一覧に出ないので、PR 側への連絡先は
        # このコメントだけ。途中で落ちていても必ず書きに行き、出せなかったことも
        # 含めて PR に残す。
        if: ${{ !cancelled() && steps.pr.outputs.number != '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.sha }}
          URL: ${{ steps.deploy.outputs.url }}
          REACHABLE: ${{ steps.reachable.outputs.ok }}
          LAST_CODE: ${{ steps.reachable.outputs.code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const marker = '<!-- firebase-hosting-preview -->';
            const pr = Number(process.env.PR_NUMBER);
            const { URL: url, HEAD_SHA: sha, RUN_URL: runUrl } = process.env;
            const note =
              '> このデプロイは `main` のコンテキスト（`workflow_run`）で走るため、PR のチェック一覧には出ません。ビルドの成否は Preview build を見てください。';
            const lines = [marker];
            if (!url) {
              lines.push(
                '⚠️ **プレビューを出せませんでした**',
                '',
                `- コミット: ${sha}`,
                `- 失敗した実行: ${runUrl}`,
                '',
                '原因は上の実行ログにあります。直したものを push すればやり直されます。',
                '',
                note,
              );
            } else {
              lines.push(
                `🔍 **プレビューデプロイ**: ${url}`,
                '',
                `- コミット: ${sha}`,
                `- チャンネル: \`pr-${pr}\`（最終デプロイから 7 日で失効、push ごとに更新）`,
                `- データ: Firestore \`preview-channels/pr-${pr}/…\`（本番と分離。空の状態から始まります）`,
                '- ルール: 本番の区間は `main`、プレビューの区間はチャンネルごとに各 PR のものを使って合成しています。',
                '- ログインは **本番と同じ Google アカウント** です（同じ Firebase プロジェクトのため）。',
                '',
                `この URL での操作は \`preview-channels/pr-${pr}\` 配下にのみ書き込まれ、本番のデータには影響しません。PR クローズ時にまとめて削除されます。`,
              );
              const reachable = process.env.REACHABLE;
              if (reachable === 'false') {
                lines.push(
                  '',
                  `⚠️ デプロイ後の疎通確認では、この URL はまだ開けていません（最後の応答: HTTP ${process.env.LAST_CODE || '不明'}）。チャンネルが配信に載るのを待っているだけなら、しばらく置いてから開くと表示されます。開けないままなら [実行ログ](${runUrl}) を見てください。`,
                );
              } else if (reachable !== 'true') {
                lines.push(
                  '',
                  `⚠️ デプロイの後の工程が失敗したため、この URL が開けることは確かめられていません。[実行ログ](${runUrl}) を見てください。`,
                );
              }
              lines.push('', note);
            }
            const body = lines.join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
            });
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr,
                body,
              });
            }
      - name: Fail when the preview URL is not reachable
        # 落とすのはコメントを書いたあと。ジョブが赤いままなので Actions 側でも
        # 気付けるし、PR 側にも「まだ開けない」ことが残っている。
        if: ${{ !cancelled() && steps.reachable.outcome == 'success' && steps.reachable.outputs.ok != 'true' }}
        env:
          URL: '${{ steps.deploy.outputs.url }}'
          LAST_CODE: '${{ steps.reachable.outputs.code }}'
        run: |
          echo "::error::プレビュー URL が開けません（最後の応答: HTTP $LAST_CODE）。$URL"
          exit 1
